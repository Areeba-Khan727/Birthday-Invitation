<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Settings -->
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Invitation</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         CONFETTI
    ========================== -->

    <div class="confetti-container"></div>



    <!-- =========================
         MAIN INVITATION PAGE
    ========================== -->

    <div class="invitation-page">

        <div class="container">


            <!-- =========================
                 INVITATION HEADING
            ========================== -->

            <div class="heading-box">


                <div class="small-title">

                    ✨ YOU ARE INVITED ✨

                </div>



                <h1>

                    Invitation for Birthday

                </h1>



                <p>

                    Come and celebrate this special day with us 🎂

                </p>


            </div>



            <!-- =========================
                 BIRTHDAY CARD IMAGE
            ========================== -->

            <div class="birthday-card">


                <img
                    src="image.png"
                    alt="Birthday Invitation Card"
                >


            </div>



            <!-- =========================
                 BLACK & WHITE THEME
            ========================== -->

            <div class="theme-note">


                <div class="theme-title">

                   “We’ll be waiting for you! <br>
                   Your presence will make this celebration even more special and bring us so much joy. 🤍✨”

                </div>


            </div>


        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
